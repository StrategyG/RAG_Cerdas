name: Institutional RAG checks
on:
  push:
    branches: [main, codespaces-institutional-rag, p0/reviewer-principal-binding]
  pull_request:
    branches: [main, codespaces-institutional-rag, p0/reviewer-principal-binding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the Supabase Edge Function
        run: deno check --no-lock supabase/functions/institutional-rag-search/index.ts

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Validate required RAG files
        run: |
          set -euo pipefail
          test -s rag_pipeline.py
          test -s eval_retrieval.py
          test -s eval_cases.json
          test -s requirements.txt
          test -s requirements-test.txt
          test -s scripts/preflight.py
          test -s scripts/supabase_http.py
          test -s scripts/download_dropbox_pdf_readonly.py
          test -s supabase/migrations/20261018182702_claim_ingest_jobs_only.sql
          test -s supabase/migrations/20261018183310_drop_duplicate_ingest_job_index.sql
          test -s supabase/verification/verify_ingestion_state.sql
          test -s supabase/verification/diagnose_ingestion_stalls.sql
          test -d tests
          test -s tests/test_page_chunking.py
          test -s tests/test_eval_metrics.py
          test -s tests/test_preflight.py
          test -s tests/test_supabase_http.py
          test -s tests/test_pipeline_dry_run.py
          test -s tests/test_dropbox_readonly_download.py

      - name: Validate Codespaces configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path(".devcontainer/devcontainer.json").read_text(encoding="utf-8"))
          assert cfg["image"].endswith("python:1-3.11-bookworm")
          assert cfg.get("postCreateCommand") == "bash .devcontainer/post-create.sh"
          secrets = cfg.get("secrets", {})
          assert "SUPABASE_URL" in secrets
          assert "SUPABASE_SERVICE_ROLE_KEY" in secrets
          assert "DROPBOX_ACCESS_TOKEN" in secrets
          print("Codespaces devcontainer JSON and recommended secret declarations are valid.")
          PY

      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Install OCR test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core

      - name: Validate Codespaces shell bootstrap
        run: bash -n .devcontainer/post-create.sh

      - name: Compile RAG modules
        run: |
          python -m py_compile rag_pipeline.py eval_retrieval.py scripts/preflight.py scripts/download_dropbox_pdf_readonly.py scripts/embedding_integrity.py
          python -m compileall -q im19

      - name: Run unit tests (required)
        run: python -m pytest -q --strict-config --strict-markers tests

      - name: Validate evaluation case schema with production evaluator rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from eval_retrieval import validate_eval_cases

          cases = json.loads(Path("eval_cases.json").read_text(encoding="utf-8"))
          validate_eval_cases(cases)
          reviewed = sum(case["label_status"].strip().lower() == "reviewed" for case in cases)
          print(
              f"Validated {len(cases)} evaluation cases using the CLI validator; "
              f"{reviewed} cases carry reviewed labels."
          )
          PY
