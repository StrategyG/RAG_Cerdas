name: Institutional RAG checks
on:
  push:
    branches: [main, codespaces-institutional-rag]
  pull_request:
    branches: [main, codespaces-institutional-rag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Validate required RAG files
        run: |
          set -euo pipefail
          test -s rag_pipeline.py
          test -s eval_retrieval.py
          test -s eval_cases.json
          test -s requirements.txt
          test -s requirements-test.txt
          test -d tests
          test -s tests/test_page_chunking.py
          test -s tests/test_eval_metrics.py

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Compile RAG modules
        run: python -m py_compile rag_pipeline.py eval_retrieval.py scripts/preflight.py

      - name: Run unit tests (required)
        run: python -m pytest -q --strict-config --strict-markers tests

      - name: Validate evaluation case schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases = json.loads(Path("eval_cases.json").read_text(encoding="utf-8"))
          assert isinstance(cases, list) and cases, "eval_cases.json must be a non-empty list"
          ids = set()
          for case in cases:
              assert isinstance(case, dict)
              assert case.get("query_id") and isinstance(case.get("query_id"), str)
              assert case.get("query") and isinstance(case.get("query"), str)
              assert case["query_id"] not in ids, f"duplicate query_id: {case['query_id']}"
              ids.add(case["query_id"])
              qrels = case.get("relevant_chunk_ids", {})
              assert isinstance(qrels, (dict, list)), "relevant_chunk_ids must be a dict or list"
              if isinstance(qrels, dict):
                  assert all(isinstance(v, int) and v >= 0 for v in qrels.values())
          print(f"Validated {len(cases)} evaluation cases; unlabeled cases remain unscored.")
          PY
