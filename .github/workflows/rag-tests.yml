name: Institutional RAG checks
on:
  push:
    branches: [main, codespaces-institutional-rag]
  pull_request:
    branches: [main, codespaces-institutional-rag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Validate required RAG files
        run: |
          set -euo pipefail
          test -s rag_pipeline.py
          test -s eval_retrieval.py
          test -s eval_cases.json
          test -s requirements.txt
          test -s requirements-test.txt
          test -s scripts/preflight.py
          test -s scripts/supabase_http.py
          test -s supabase/migrations/20261018182702_claim_ingest_jobs_only.sql
          test -s supabase/migrations/20261018183310_drop_duplicate_ingest_job_index.sql
          test -s supabase/verification/verify_ingestion_state.sql
          test -d tests
          test -s tests/test_page_chunking.py
          test -s tests/test_eval_metrics.py
          test -s tests/test_preflight.py
          test -s tests/test_supabase_http.py
          test -s tests/test_pipeline_dry_run.py

      - name: Validate Codespaces configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path(".devcontainer/devcontainer.json").read_text(encoding="utf-8"))
          assert cfg["image"].endswith("python:1-3.11-bookworm")
          assert cfg.get("postCreateCommand") == "bash .devcontainer/post-create.sh"
          secrets = cfg.get("secrets", {})
          assert "SUPABASE_URL" in secrets
          assert "SUPABASE_SERVICE_ROLE_KEY" in secrets
          assert "DROPBOX_ACCESS_TOKEN" in secrets
          print("Codespaces devcontainer JSON and recommended secret declarations are valid.")
          PY

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Validate Codespaces shell bootstrap
        run: bash -n .devcontainer/post-create.sh

      - name: Compile RAG modules
        run: python -m py_compile rag_pipeline.py eval_retrieval.py scripts/preflight.py

      - name: Run unit tests (required)
        run: python -m pytest -q --strict-config --strict-markers tests

      - name: Validate evaluation case schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases = json.loads(Path("eval_cases.json").read_text(encoding="utf-8"))
          assert isinstance(cases, list) and cases, "eval_cases.json must be a non-empty list"
          ids = set()
          for case in cases:
              assert isinstance(case, dict)
              assert case.get("query_id") and isinstance(case.get("query_id"), str)
              assert case.get("query") and isinstance(case.get("query"), str)
              assert case["query_id"] not in ids, f"duplicate query_id: {case['query_id']}"
              ids.add(case["query_id"])
              status = case.get("label_status")
              assert isinstance(status, str) and status, "label_status must be explicit"
              qrels = case.get("relevant_chunk_ids", {})
              assert isinstance(qrels, (dict, list)), "relevant_chunk_ids must be a dict or list"
              if status == "reviewed":
                  if isinstance(qrels, dict):
                      assert all(isinstance(cid, str) and cid.strip() for cid in qrels), "reviewed qrels need non-empty chunk IDs"
                      assert all(type(grade) is int and grade >= 0 for grade in qrels.values()), "reviewed qrels grades must be non-negative integers"
                  else:
                      assert all(isinstance(cid, (str, int)) and not isinstance(cid, bool) and str(cid).strip() for cid in qrels), "reviewed qrels list needs non-empty chunk IDs"
          print(f"Validated {len(cases)} evaluation cases; only explicitly reviewed labels can be scored.")
          PY
