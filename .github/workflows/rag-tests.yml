name: Institutional RAG checks
on:
  push:
    branches: [main, codespaces-institutional-rag]
  pull_request:
    branches: [main, codespaces-institutional-rag]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules when present
        run: |
          for f in rag_pipeline.py eval_retrieval.py; do
            if [ -f "$f" ]; then python -m py_compile "$f"; fi
          done
      - name: Run tests when present
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "No tests directory yet"; fi
