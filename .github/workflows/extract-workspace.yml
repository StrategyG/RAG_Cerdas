name: Extract RAG_Cerdas Workspace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect archive contents
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="workspace(1).tar.gz"
          test -f "$ARCHIVE"
          tar -tzf "$ARCHIVE" > archive_listing.txt
          echo "===== ARCHIVE CONTENT (first 200 lines) ====="
          sed -n '1,200p' archive_listing.txt

      - name: Validate and safely extract archive
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_workspace_archive.py --archive "workspace(1).tar.gz" --destination extracted_workspace

      - name: Package extracted workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --create --gzip --file=workspace-extracted.tar.gz extracted_workspace
          ls -lh workspace-extracted.tar.gz

      - name: Upload extracted workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-extracted
          path: workspace-extracted.tar.gz
          retention-days: 7

      - name: Upload workspace manifest
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manifest
          path: extracted_workspace/workspace_manifest.txt
          retention-days: 7
