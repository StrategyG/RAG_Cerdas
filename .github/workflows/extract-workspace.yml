name: Extract RAG_Cerdas Workspace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify archive
        run: |
          set -euo pipefail

          ARCHIVE="workspace(1).tar.gz"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Archive not found: $ARCHIVE"
            exit 1
          fi

          echo "Archive found:"
          ls -lh "$ARCHIVE"

      - name: Inspect archive
        run: |
          set -euo pipefail

          echo "===== ARCHIVE CONTENT ====="
          tar -tzf "workspace(1).tar.gz" | head -200

      - name: Extract workspace
        run: |
          set -euo pipefail

          rm -rf extracted_workspace
          mkdir -p extracted_workspace

          tar \
            --extract \
            --gzip \
            --file="workspace(1).tar.gz" \
            --directory=extracted_workspace

      - name: Display workspace structure
        run: |
          set -euo pipefail

          echo "===== EXTRACTED STRUCTURE ====="

          find extracted_workspace \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500

      - name: Create workspace manifest
        run: |
          set -euo pipefail

          find extracted_workspace \
            -type f \
            -printf '%p\n' \
            | sort \
            > extracted_workspace/workspace_manifest.txt

          echo "===== FILE COUNT ====="
          wc -l extracted_workspace/workspace_manifest.txt

      - name: Package extracted workspace
        run: |
          set -euo pipefail

          tar \
            --create \
            --gzip \
            --file=workspace-extracted.tar.gz \
            extracted_workspace

          ls -lh workspace-extracted.tar.gz

      - name: Upload extracted workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-extracted
          path: workspace-extracted.tar.gz
          retention-days: 7

      - name: Upload workspace manifest
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manifest
          path: extracted_workspace/workspace_manifest.txt
          retention-days: 7
