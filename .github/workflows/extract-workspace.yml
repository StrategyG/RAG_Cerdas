name: Extract RAG_Cerdas Workspace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate and safely extract archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path("workspace(1).tar.gz")
          destination = Path("extracted_workspace")

          if not archive.is_file():
              raise SystemExit("Archive not found: workspace(1).tar.gz")
          if destination.exists():
              raise SystemExit("Destination already exists; refusing to overwrite it.")

          destination.mkdir()
          root = destination.resolve()
          seen = set()
          file_count = 0
          total_size = 0
          max_files = 25000
          max_total_size = 2 * 1024 * 1024 * 1024

          with tarfile.open(archive, mode="r:gz") as tar:
              members = tar.getmembers()
              if len(members) > max_files:
                  raise SystemExit(f"Archive has too many members: {len(members)}")
              validated = []
              for member in members:
                  raw_name = member.name
                  path = PurePosixPath(raw_name)
                  if (
                      not raw_name
                      or path.is_absolute()
                      or "\\\\" in raw_name
                      or ".." in path.parts
                      or not path.parts
                  ):
                      raise SystemExit(f"Unsafe archive path rejected: {raw_name!r}")
                  if not (member.isdir() or member.isreg()):
                      raise SystemExit(f"Links/special archive entries are not allowed: {raw_name!r}")
                  normalized = path.as_posix()
                  if normalized in seen:
                      raise SystemExit(f"Duplicate archive path rejected: {normalized!r}")
                  seen.add(normalized)
                  target = (root / Path(*path.parts)).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      raise SystemExit(f"Archive path escapes destination: {raw_name!r}")
                  if member.isreg():
                      file_count += 1
                      total_size += member.size
                      if total_size > max_total_size:
                          raise SystemExit("Archive exceeds the 2 GiB uncompressed size limit.")
                  validated.append((member, path, target))

              # Only regular files and directories are materialized; archive content is never executed.
              for member, path, target in validated:
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = tar.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Could not read archive member: {member.name!r}")
                  with source, target.open("xb") as output:
                      while True:
                          block = source.read(1024 * 1024)
                          if not block:
                              break
                          output.write(block)

          files = sorted(
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file()
          )
          manifest = root / "workspace_manifest.txt"
          manifest.write_text("".join(name + "\\n" for name in files), encoding="utf-8")
          print(f"Archive validated. Extracted files: {len(files)}; declared uncompressed bytes: {total_size}")
          print("First 200 paths:")
          print("\\n".join(files[:200]))
          PY

      - name: Package extracted workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --create --gzip --file=workspace-extracted.tar.gz extracted_workspace
          ls -lh workspace-extracted.tar.gz

      - name: Upload extracted workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-extracted
          path: workspace-extracted.tar.gz
          retention-days: 7

      - name: Upload workspace manifest
        uses: actions/upload-artifact@v4
        with:
          name: workspace-manifest
          path: extracted_workspace/workspace_manifest.txt
          retention-days: 7
